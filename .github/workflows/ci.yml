name: CI/CD Pipeline - Teamable App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Opcional: Si quieres levantar un servicio de MongoDB efímero para correr los tests que lo requieran
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias limpias
      - name: Install dependencies
        run: npm ci

      # 4. Ejecutar pruebas unitarias (tests/)
      - name: Run Unit Tests
        run: npm test
        env:
          DB_ADDRESS: localhost:27017
          DEV: true

      # 5. Verificar que el Dockerfile compila correctamente
      - name: Build Docker Image
        run: docker build -t teamable-app:${{ github.sha }} .