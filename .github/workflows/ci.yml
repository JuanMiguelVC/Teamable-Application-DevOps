name: CI/CD Pipeline - Teamable App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permissions required for GitHub Actions to write to the Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      # 1. Download the code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Node.js environment
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 3. Install clean dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run unit tests
      - name: Run Unit Tests
        run: npm test
        env:
          DB_ADDRESS: localhost:27017
          DEV: true

      # 5. Log in to GitHub Container Registry (Only on the main branch, not on Pull Requests)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 6. Build and tag the Docker image
      - name: Build Docker Image
        run: |
          # Convertimos el nombre del propietario y repositorio a minúsculas por requerimiento de Docker
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_OWNER/teamable-app"

          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .

      # 7. Push the Docker image to GitHub Container Registry (Only on the main branch, not on Pull Requests)
      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_OWNER/teamable-app"

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
